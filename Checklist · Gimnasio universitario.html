<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist · Gimnasio universitario</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e3e3df;--ac:#2f7d5b;--tr:#e8e8e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222427;--tx:#e8e8e6;--mu:#9aa0a6;--bd:#33363a;--ac:#4cb88a;--tr:#33363a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222427;--tx:#e8e8e6;--mu:#9aa0a6;--bd:#33363a;--ac:#4cb88a;--tr:#33363a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 16px}
.bar{height:8px;background:var(--tr);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 12px;z-index:5}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mu);margin-bottom:6px}
button.reset{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.8rem}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:14px 0}
h2{font-size:1rem;margin:0 0 2px}
.who{color:var(--mu);font-size:.8rem;margin-bottom:8px}
label{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;cursor:pointer;border-top:1px solid var(--bd)}
label:first-of-type{border-top:0}
input{width:20px;height:20px;margin-top:2px;accent-color:var(--ac);flex:none;cursor:pointer}
input:checked+span{color:var(--mu);text-decoration:line-through}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--tr);padding:1px 5px;border-radius:4px}
.cnt{float:right;font-size:.8rem;color:var(--mu);font-weight:400}
</style>
</head>
<body>
<main>
<h1>Gimnasio universitario · Entrega 2</h1>
<p class="sub">Marca cada casilla; el progreso se guarda en este navegador.</p>
<div class="top"><div class="row"><span id="gt">0 de 0</span><button class="reset" id="rs">Reiniciar</button></div><div class="bar"><i id="gb"></i></div></div>
<div id="app"></div>
</main>
<script>
const G=[
["HU-01 · Registro y eliminación de usuarios","Samuel",["Clase `Usuario` con validación en `__post_init__`","`UsuarioRepositorio` (abstracto) y `UsuarioRepositorioMemoria`","`registrar_usuario` y `eliminar_usuario` en `GymService`","Pruebas: duplicado, vacíos, nombre que no coincide y eliminación en cascada"]],
["HU-02 · Reservas de cupos","Samuel",["Clase `Reserva` con `cancelar()`, `confirmar()`, `coincide_con()` y `mostrar_resumen()`","`ReservaRepositorio` y `ReservaRepositorioMemoria` (incluye `buscar` y `eliminar_por_documento`)","`realizar_reserva`, `cancelar_reserva` y `confirmar_reserva`","Pruebas de cada criterio, incluida la reserva cancelada y vuelta a crear"]],
["HU-03 · Interfaz de usuarios y reservas, y ensamblaje","Samuel",["`PanelUsuarios` y `PanelReservas` usando `PanelBase.ejecutar`","`main.py`: `crear_servicio`, `cargar_datos_demo` y `flujo_consola` con `try/except GymError`","Integrar los paneles de los otros dos módulos cuando estén fusionados","`README.md` con instrucciones de ejecución"]],
["HU-04 · Registro de visitas y validación de fechas","Juan José",["`es_bisiesto` y `es_fecha_valida` en `modelos.py`","Clase `Visita` con validación en `__post_init__`","`VisitaRepositorio` y `VisitaRepositorioMemoria`","`registrar_visita` en `GymService` y sus pruebas"]],
["HU-05 · Estadísticas de uso","Juan José",["Los cuatro métodos de estadística en `GymService`","Los dos métodos de datos que usan los gráficos","Pruebas con datos conocidos y con el sistema vacío"]],
["HU-06 · Interfaz de visitas y estadísticas","Juan José",["`PanelVisitas` y `PanelEstadisticas`","`requirements.txt` con las librerías externas","Probar la pantalla con `python main.py --demo`"]],
["HU-07 · Consultas de reserva y disponibilidad","Angelina",["Los tres métodos en `GymService`","Pruebas de los tres estados de disponibilidad","Entregar a Samuel el formato de lo que devuelve R14 para su tabla"]],
["HU-08 · Prioridad de membresía","Angelina",["Clase `Prioridad` con `limite_confirmacion()`, `esta_vencida()` y `confirmar()`","`PrioridadRepositorio` y `PrioridadRepositorioMemoria`","`prioridad_membresia`, `confirmar_prioridad` y `_liberar_prioridades_vencidas`","Pruebas con horas fijas: justo en el límite, un minuto después, empate de tiempo"]],
["HU-09 · Ventana principal, prioridades y diseño","Angelina",["`VentanaPrincipal`, `componentes.py` y `PanelPrioridades`","Dibujar el diagrama de clases v2 y actualizar el enlace","Revisar que las secciones 3.1 a 3.5 del documento coincidan con el código"]],
["Definición de terminado (por historia)","Los tres",["Cumple todos sus criterios de aceptación","Tiene pruebas unitarias que pasan","Su PR fue revisado y fusionado por otra persona","El documento de análisis sigue coincidiendo con el código","Quien la hizo puede explicarla sin mirar el código"]],
["Validación conjunta","Los tres",["Paso 1 (Samuel y Juan José): registrar dos usuarios, registrar visitas y verificar que una duración de 0 lance el error esperado","Paso 2 (Samuel): reservar un horario, intentar una segunda reserva el mismo día y comprobar el error","Paso 3 (Juan José y Angelina): con tres visitas en un horario, solicitar prioridad y confirmarla","Paso 4 (Angelina y Samuel): intentar reservar el cupo apartado con otro usuario y comprobar `CupoApartadoError`","Paso 5 (Angelina): confirmar una prioridad pasado el límite y verificar que el cupo queda libre","Paso 6 (Juan José): revisar horario más frecuente, promedio por usuario y ranking de equipos","Paso 7 (los tres): eliminar un usuario y comprobar que desaparecen sus reservas, visitas y prioridades","Paso 8 (los tres): abrir cada pantalla, provocar un error y verificar que aparece el cuadro de diálogo sin cerrar la aplicación"]]
];
const K="gym-checklist-v1";let st={};
try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/`([^`]+)`/g,"<code>$1</code>")}
const app=document.getElementById("app");
G.forEach((g,i)=>{
 const s=document.createElement("section");
 s.innerHTML=`<h2>${esc(g[0])}<span class="cnt" id="c${i}"></span></h2><div class="who">${g[1]}</div>`+
 g[2].map((t,j)=>`<label><input type="checkbox" data-k="${i}-${j}" ${st[i+"-"+j]?"checked":""}><span>${esc(t)}</span></label>`).join("");
 app.appendChild(s);
});
function upd(){
 let tot=0,done=0;
 G.forEach((g,i)=>{let d=0;g[2].forEach((_,j)=>{if(st[i+"-"+j])d++});tot+=g[2].length;done+=d;document.getElementById("c"+i).textContent=d+"/"+g[2].length});
 document.getElementById("gt").textContent=done+" de "+tot+" completadas";
 document.getElementById("gb").style.width=(tot?done/tot*100:0)+"%";
}
app.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;if(e.target.checked)st[k]=1;else delete st[k];save();upd()});
document.getElementById("rs").onclick=()=>{if(confirm("¿Desmarcar todo?")){st={};save();document.querySelectorAll("input").forEach(c=>c.checked=false);upd()}};
upd();
</script>
</body>
</html>
